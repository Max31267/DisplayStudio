<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"><rect width="1000" height="760" rx="24" fill="#f3f6fc"/><g font-family="Segoe UI,Arial,sans-serif" fill="#17243a"><text x="40" y="48" font-size="26" font-weight="bold">ESP32-C3 SuperMini → ST7789 240×240</text><text x="40" y="80" font-size="17">Логическая схема: положение контактов на ваших платах может отличаться</text><rect x="40" y="110" width="310" height="460" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="650" y="110" width="310" height="460" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="72" y="150" font-size="23" font-weight="bold">ESP32-C3</text><text x="680" y="150" font-size="23" font-weight="bold">ST7789 · SPI</text><text x="72" y="201" font-size="21">3V3</text><path d="M300 195 H680" stroke="#ef4444" stroke-width="5"/><circle cx="300" cy="195" r="6" fill="#ef4444"/><circle cx="680" cy="195" r="6" fill="#ef4444"/><rect x="698" y="175" width="245" height="33" fill="white"/><text x="707" y="201" font-size="20">VCC · 3,3 В</text><text x="72" y="247" font-size="21">GND</text><path d="M300 241 H680" stroke="#64748b" stroke-width="5"/><circle cx="300" cy="241" r="6" fill="#64748b"/><circle cx="680" cy="241" r="6" fill="#64748b"/><rect x="698" y="221" width="245" height="33" fill="white"/><text x="707" y="247" font-size="20">GND</text><text x="72" y="293" font-size="21">GPIO4</text><path d="M300 287 H680" stroke="#eab308" stroke-width="5"/><circle cx="300" cy="287" r="6" fill="#eab308"/><circle cx="680" cy="287" r="6" fill="#eab308"/><rect x="698" y="267" width="245" height="33" fill="white"/><text x="707" y="293" font-size="20">SCL / CLK</text><text x="72" y="339" font-size="21">GPIO6</text><path d="M300 333 H680" stroke="#22c55e" stroke-width="5"/><circle cx="300" cy="333" r="6" fill="#22c55e"/><circle cx="680" cy="333" r="6" fill="#22c55e"/><rect x="698" y="313" width="245" height="33" fill="white"/><text x="707" y="339" font-size="20">SDA / DIN</text><text x="72" y="385" font-size="21">GPIO7</text><path d="M300 379 H680" stroke="#f97316" stroke-width="5"/><circle cx="300" cy="379" r="6" fill="#f97316"/><circle cx="680" cy="379" r="6" fill="#f97316"/><rect x="698" y="359" width="245" height="33" fill="white"/><text x="707" y="385" font-size="20">CS · если есть</text><text x="72" y="431" font-size="21">GPIO1</text><path d="M300 425 H680" stroke="#3b82f6" stroke-width="5"/><circle cx="300" cy="425" r="6" fill="#3b82f6"/><circle cx="680" cy="425" r="6" fill="#3b82f6"/><rect x="698" y="405" width="245" height="33" fill="white"/><text x="707" y="431" font-size="20">DC / A0</text><text x="72" y="477" font-size="21">GPIO3</text><path d="M300 471 H680" stroke="#a855f7" stroke-width="5"/><circle cx="300" cy="471" r="6" fill="#a855f7"/><circle cx="680" cy="471" r="6" fill="#a855f7"/><rect x="698" y="451" width="245" height="33" fill="white"/><text x="707" y="477" font-size="20">RES / RST</text><text x="72" y="523" font-size="21">GPIO5</text><path d="M300 517 H680" stroke="#06b6d4" stroke-width="5"/><circle cx="300" cy="517" r="6" fill="#06b6d4"/><circle cx="680" cy="517" r="6" fill="#06b6d4"/><rect x="698" y="497" width="245" height="33" fill="white"/><text x="707" y="523" font-size="20">BL / PWM · см. ниже</text><text x="40" y="610" font-size="19">USB платы → ПК · GPIO18/19 не занимать · MISO не нужен</text><text x="40" y="648" font-size="18">GPIO5 → BL напрямую только для логического входа PWM 3,3 В.</text><text x="40" y="680" font-size="18">Если BL питает светодиоды: GPIO5 → PWM-вход внешнего драйвера;</text><text x="40" y="710" font-size="18">подсветка питается через драйвер, не от GPIO. Общая земля обязательна.</text></g></svg>